<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h2 class="text-center">Student Management System</h2>

<form action="/add" method="POST" class="mb-3">
    <input type="text" name="name" placeholder="Student Name" class="form-control mb-2" required>

    <input type="text" name="course" placeholder="Course" class="form-control mb-2" required>

    <button class="btn btn-primary">Add Student</button>
</form>

<table class="table table-bordered">
    <tr>
        <th>Name</th>
        <th>Course</th>
        <th>Action</th>
    </tr>

    {% for student in students %}
    <tr>
        <td>{{ student.name }}</td>
        <td>{{ student.course }}</td>
        <td>
            <a href="/delete/{{ loop.index0 }}" class="btn btn-danger btn-sm">
                Delete
            </a>
        </td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
